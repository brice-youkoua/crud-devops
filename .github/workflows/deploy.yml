name: CI/CD - Cloud Run (TP)

on:
  push:
    tags:
      - 'v*.*.*'  # déclenche sur les tags vX.X.X

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build and push API image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:${{ env.VERSION }} -t ${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:latest ./App
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:latest

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Replace variables in cloud-run-service.yaml
        run: |
          cp cloud-run-service.yaml cloud-run-service.generated.yaml
          sed -i "s|__IMAGE_URI__|docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:${{ env.VERSION }}|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_HOST__|${{ secrets.DB_HOST }}|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_NAME__|${{ secrets.DB_NAME }}|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_USER__|${{ secrets.DB_USER }}|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" cloud-run-service.generated.yaml
          sed -i "s|__LOKI_URL__|${{ secrets.LOKI_URL }}|g" cloud-run-service.generated.yaml
          sed -i "s|__REGION__|${{ secrets.GCP_REGION }}|g" cloud-run-service.generated.yaml
          sed -i "s|__PROJECT_ID__|${{ secrets.GCP_PROJECT_ID }}|g" cloud-run-service.generated.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy crud-api \
            --image docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/crud-api:${{ env.VERSION }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars DB_HOST=${{ secrets.DB_HOST }} \
            --set-env-vars DB_NAME=${{ secrets.DB_NAME }} \
            --set-env-vars DB_USER=${{ secrets.DB_USER }} \
            --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set-env-vars LOKI_URL=${{ secrets.LOKI_URL }}

      - name: Allow unauthenticated access
        run: |
          gcloud run services add-iam-policy-binding crud-api \
            --region=${{ secrets.GCP_REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker"
