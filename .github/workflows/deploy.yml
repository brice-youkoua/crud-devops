name: CI/CD CRUD API

on:
  push:
    tags:
      - 'v.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # ===== Repository Variables =====
      CLOUD_RUN_SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
      REGION: ${{ vars.REGION }}
      VERSION: ${{ github.ref_name }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_USER: ${{ vars.DB_USER }}
      DB_NAME: ${{ vars.DB_NAME }}
      LOKI_URL: ${{ vars.LOKI_URL }}

      # ===== Secrets =====
      DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract tag version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & push CRUD API Docker image
        run: |
          docker build -t $DOCKER_USERNAME/crud-api:$VERSION ./App
          docker push $DOCKER_USERNAME/crud-api:$VERSION
          docker tag $DOCKER_USERNAME/crud-api:$VERSION $DOCKER_USERNAME/crud-api:latest
          docker push $DOCKER_USERNAME/crud-api:latest

      - name: Build & push Fluent Bit Docker image
        run: |
          docker build -t $DOCKER_USERNAME/fluent-bit:$VERSION ./fluent-bit
          docker push $DOCKER_USERNAME/fluent-bit:$VERSION
          docker tag $DOCKER_USERNAME/fluent-bit:$VERSION $DOCKER_USERNAME/fluent-bit:latest
          docker push $DOCKER_USERNAME/fluent-bit:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Simulate Flyway migrations
        run: |
          echo "Simulating Flyway migrations..."
          echo "JDBC_URL would be: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
          echo "DB_USER: $DB_USER"
          echo "Migrations folder: $PWD/db/migrations"
          echo "✅ Migrations skipped (simulation)"

      - name: Replace variables in cloud-run-service.yaml
        run: |
          cp cloud-run-service.yaml cloud-run-service.generated.yaml
          sed -i "s|__IMAGE_URI__|docker.io/$DOCKER_USERNAME/crud-api:$VERSION|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_HOST__|$DB_HOST|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_NAME__|$DB_NAME|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_USER__|$DB_USER|g" cloud-run-service.generated.yaml
          sed -i "s|__DB_PASSWORD__|$DB_PASSWORD|g" cloud-run-service.generated.yaml
          sed -i "s|__LOKI_URL__|$LOKI_URL|g" cloud-run-service.generated.yaml
          sed -i "s|__REGION__|$REGION|g" cloud-run-service.generated.yaml
          sed -i "s|__PROJECT_ID__|$GCP_PROJECT_ID|g" cloud-run-service.generated.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --image "$DOCKER_USERNAME/crud-api:$VERSION"

      - name: Ensure service is publicly invokable
        run: |
          gcloud run services add-iam-policy-binding "$CLOUD_RUN_SERVICE_NAME" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID"
