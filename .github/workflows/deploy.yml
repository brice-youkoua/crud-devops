name: CI/CD CRUD API

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CLOUD_RUN_SERVICE_NAME: crud-api-service
      REGION: europe-west1
      VERSION: ${{ github.ref_name }}

      # ===== Secrets =====
      DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      GCP_PROJECT_ID: cdprojet-479421
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      LOKI_URL: ${{ secrets.LOKI_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & push CRUD API Docker image
        run: |
          echo "Building CRUD API image..."
          docker build -t $DOCKER_USERNAME/crud-api:$VERSION ./App
          docker push $DOCKER_USERNAME/crud-api:$VERSION
          docker tag $DOCKER_USERNAME/crud-api:$VERSION $DOCKER_USERNAME/crud-api:latest
          docker push $DOCKER_USERNAME/crud-api:latest

      - name: Build & push Fluent Bit Docker image
        run: |
          echo "Building Fluent Bit image..."
          docker build -t $DOCKER_USERNAME/fluent-bit:$VERSION ./fluent-bit
          docker push $DOCKER_USERNAME/fluent-bit:$VERSION
          docker tag $DOCKER_USERNAME/fluent-bit:$VERSION $DOCKER_USERNAME/fluent-bit:latest
          docker push $DOCKER_USERNAME/fluent-bit:latest

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Simulate Flyway migrations
        run: |
          echo "Simulating Flyway migrations..."
          echo "JDBC_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
          echo "DB_USER: $DB_USER"
          echo "✅ Migrations skipped (simulation)"

      - name: Replace variables in Cloud Run YAML
        run: |
          cp cloud-run-service.yaml cloud-run-service.generated.yaml
          sed -i "s|{{DOCKER_USERNAME}}|$DOCKER_USERNAME|g" cloud-run-service.generated.yaml
          sed -i "s|{{VERSION}}|$VERSION|g" cloud-run-service.generated.yaml
          sed -i "s|{{CLOUD_RUN_SERVICE_NAME}}|$CLOUD_RUN_SERVICE_NAME|g" cloud-run-service.generated.yaml
          sed -i "s|{{DB_HOST}}|$DB_HOST|g" cloud-run-service.generated.yaml
          sed -i "s|{{DB_USER}}|$DB_USER|g" cloud-run-service.generated.yaml
          sed -i "s|{{DB_PASSWORD}}|$DB_PASSWORD|g" cloud-run-service.generated.yaml
          sed -i "s|{{DB_NAME}}|$DB_NAME|g" cloud-run-service.generated.yaml
          sed -i "s|{{LOKI_URL}}|$LOKI_URL|g" cloud-run-service.generated.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --image "docker.io/$DOCKER_USERNAME/crud-api:$VERSION"

      - name: Ensure service is publicly invokable
        run: |
          gcloud run services add-iam-policy-binding "$CLOUD_RUN_SERVICE_NAME" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID"
