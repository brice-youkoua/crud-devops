apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: crud-api-service
spec:
  template:
    spec:
      containers:
        - image: "ngongang97/crud-api:{{VERSION}}"
          env:
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: LOKI_URL
              value: "{{LOKI_URL}}"
