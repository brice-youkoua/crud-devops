apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{CLOUD_RUN_SERVICE_NAME}}
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cloudsql-instances: ""
    spec:
      containers:
        - image: {{DOCKER_USERNAME}}/crud-api:{{VERSION}}
          env:
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: LOKI_URL
              value: "{{LOKI_URL}}"
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: 1
      containerConcurrency: 80
      timeoutSeconds: 300
