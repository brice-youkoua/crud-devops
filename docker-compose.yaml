services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: ./App
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_started

    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      LOG_DIR: ${LOG_DIR}
    volumes:
      - ./logs:/var/logs/crud
    ports:
      - "8080:80"
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:2.2
    depends_on:
      - app
    volumes:
      - ./logs:/var/logs/crud:ro
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

    restart: unless-stopped
 
  flyway:
    image: flyway/flyway:9
    env_file:
      - .env
    command: -url=${DB_HOST} -user=${DB_USER} -password=${DB_PASSWORD} migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - db
    restart: "no"

volumes:
  db_data:


